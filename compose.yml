# Choiz MCP Gateway stack
#
#   Claude -> Cloudflare Worker -> cloudflared tunnel -> gateway -> MCP container(s)
#
# Each MCP container speaks MCP Streamable HTTP (what claude.ai uses). If the
# underlying MCP server only speaks stdio, we wrap it with supergateway inside
# the same container (see ./mcp/warehouse/Dockerfile).
#
# Only the gateway is reachable from cloudflared (127.0.0.1:8080).
# MCP containers are on an internal Docker network.
#
# Images are built and pushed by GitHub Actions (.github/workflows/deploy-gateway.yml)
# to GHCR. The EC2 only pulls. To rebuild locally for development, override with
# `docker compose -f compose.yml -f compose.dev.yml up --build`.

services:
  gateway:
    image: ghcr.io/choizapp/choiz-mcp-gateway/gateway:${IMAGE_TAG:-latest}
    environment:
      PORT: "8080"
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?set WORKER_SHARED_SECRET in .env}
      # Comma-separated list of Workspace domains the gateway will accept on
      # the X-Choiz-User-Email header. Mirrors the Worker's
      # ALLOWED_EMAIL_DOMAINS. Defaults inside auth.ts cover the same three
      # if the env is unset, so this is mainly for explicitness + override.
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-choiz.com.mx,choiz.com.ar,gotimeless.ai}
      # Warehouse JSON query endpoint (POST /api/warehouse/query), consumed by
      # the Vercel dashboard (kapso-ops-dashboard). The gateway connects to the
      # RDS directly with pg and runs every statement in a READ ONLY transaction.
      # Reuse the warehouse role (already read-only) or point
      # WAREHOUSE_READONLY_DATABASE_URL at a stricter role. The Worker gates this
      # endpoint with DASHBOARD_API_KEY (a wrangler secret) before forwarding.
      WAREHOUSE_DATABASE_URL: ${WAREHOUSE_DATABASE_URL:?set WAREHOUSE_DATABASE_URL in .env}
      WAREHOUSE_READONLY_DATABASE_URL: ${WAREHOUSE_READONLY_DATABASE_URL:-}
      WAREHOUSE_STATEMENT_TIMEOUT_MS: ${WAREHOUSE_STATEMENT_TIMEOUT_MS:-60000}
      UPSTREAM_WAREHOUSE: "http://warehouse_mcp:8080"
      UPSTREAM_META_ADS: "http://meta_ads_mcp:8080"
      UPSTREAM_FACEBOOK_CHOIZ: "http://facebook_choiz_mcp:8080"
      UPSTREAM_FACEBOOK_TIMELESS: "http://facebook_timeless_mcp:8080"
      UPSTREAM_INSTAGRAM_CHOIZ: "http://instagram_choiz_mcp:8080"
      UPSTREAM_INSTAGRAM_TIMELESS: "http://instagram_timeless_mcp:8080"
      UPSTREAM_GA4_CHOIZ: "http://ga4_choiz_mcp:8080"
      UPSTREAM_GA4_TIMELESS: "http://ga4_timeless_mcp:8080"
      UPSTREAM_GSC_CHOIZ: "http://gsc_choiz_mcp:8080"
      UPSTREAM_GSC_TIMELESS: "http://gsc_timeless_mcp:8080"
      UPSTREAM_SHOPIFY_CHOIZ: "http://shopify_choiz_mcp:8080"
      UPSTREAM_SHOPIFY_TIMELESS: "http://shopify_timeless_mcp:8080"
      UPSTREAM_POWERBI_CHOIZ: "http://powerbi_choiz_mcp:8080"
      UPSTREAM_POWERBI_TIMELESS: "http://powerbi_timeless_mcp:8080"
      UPSTREAM_TIKTOK_ORGANIC_CHOIZ: "http://tiktok_organic_choiz_mcp:8080"
      UPSTREAM_DHL: "http://dhl_mcp:8080"
      UPSTREAM_SHEETS: "http://sheets_mcp:8080"
      UPSTREAM_VIRAL_LOOPS: "http://viral_loops_mcp:8080"
      # Remote MCPs proxied through the gateway (no internal container).
      # The route is only registered if the corresponding API key is set;
      # gateway/src/index.ts logs a skip-warning otherwise. See memory
      # project_wrap_remote_mcps + the remoteUpstreams table in index.ts.
      KAPSO_API_KEY_CHOIZ_SALES:      ${KAPSO_API_KEY_CHOIZ_SALES:-}
      KAPSO_API_KEY_CHOIZ_SUPPORT:    ${KAPSO_API_KEY_CHOIZ_SUPPORT:-}
      KAPSO_API_KEY_TIMELESS_SALES:   ${KAPSO_API_KEY_TIMELESS_SALES:-}
      KAPSO_API_KEY_TIMELESS_SUPPORT: ${KAPSO_API_KEY_TIMELESS_SUPPORT:-}
      # Re-enabled 2026-05-07: cutover to the official googleads/google-ads-mcp
      # eliminates supergateway --stateless, so the original tunnel-zombie
      # trigger (per-request gRPC channel storm to googleads.googleapis.com)
      # is structurally gone. Single in-process FastMCP holds one persistent
      # GoogleAdsClient. See memory project_google_ads_destabilizes_host_CONFIRMED
      # for the original incident.
      UPSTREAM_GOOGLE_ADS: "http://google_ads_mcp:8080"
    ports:
      # Bind only to the host's loopback; cloudflared runs on the same host.
      - "127.0.0.1:8080:8080"
    depends_on:
      - warehouse_mcp
      - meta_ads_mcp
      - facebook_choiz_mcp
      - facebook_timeless_mcp
      - instagram_choiz_mcp
      - instagram_timeless_mcp
      - ga4_choiz_mcp
      - ga4_timeless_mcp
      - gsc_choiz_mcp
      - gsc_timeless_mcp
      - shopify_choiz_mcp
      - shopify_timeless_mcp
      - google_ads_mcp
      - powerbi_choiz_mcp
      - powerbi_timeless_mcp
      - tiktok_organic_choiz_mcp
      - dhl_mcp
      - sheets_mcp
      - viral_loops_mcp
    restart: unless-stopped

  warehouse_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/warehouse:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URI: ${WAREHOUSE_DATABASE_URL:?set WAREHOUSE_DATABASE_URL in .env}
    restart: unless-stopped
    # No ports: block. Gateway reaches it by service name on the internal network.
    # FastMCP serves streamable-http at "/" via the in-place __init__ patch in
    # mcp/warehouse/entrypoint.py. The pydantic-settings env var
    # FASTMCP_STREAMABLE_HTTP_PATH does NOT work for this — verified empirically —
    # because FastMCP's __init__ kwarg default has higher precedence.

  meta_ads_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/meta-ads:${IMAGE_TAG:-latest}
    environment:
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?set META_ACCESS_TOKEN in .env}
    restart: unless-stopped

  # Facebook MCP — multi-tenant pattern: one container per Choiz tenant,
  # both built from the same image, only env (token + page id) differs.
  # Slug convention: /mcp/facebook-<tenant>/.
  facebook_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/facebook:${IMAGE_TAG:-latest}
    environment:
      FACEBOOK_ACCESS_TOKEN: ${FACEBOOK_CHOIZ_ACCESS_TOKEN:?set FACEBOOK_CHOIZ_ACCESS_TOKEN in .env}
      FACEBOOK_PAGE_ID: ${FACEBOOK_CHOIZ_PAGE_ID:?set FACEBOOK_CHOIZ_PAGE_ID in .env}
    restart: unless-stopped

  facebook_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/facebook:${IMAGE_TAG:-latest}
    environment:
      FACEBOOK_ACCESS_TOKEN: ${FACEBOOK_TIMELESS_ACCESS_TOKEN:?set FACEBOOK_TIMELESS_ACCESS_TOKEN in .env}
      FACEBOOK_PAGE_ID: ${FACEBOOK_TIMELESS_PAGE_ID:?set FACEBOOK_TIMELESS_PAGE_ID in .env}
    restart: unless-stopped

  # Instagram MCP — multi-tenant pattern, mirroring facebook. One image, two
  # containers; tenants differ in INSTAGRAM_ACCESS_TOKEN + INSTAGRAM_BUSINESS_ACCOUNT_ID.
  # FACEBOOK_APP_ID / FACEBOOK_APP_SECRET are shared (single Choiz Facebook app).
  # INSTAGRAM_API_VERSION is pinned literally; bump in lockstep with the fork.
  instagram_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/instagram:${IMAGE_TAG:-latest}
    environment:
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_CHOIZ_ACCESS_TOKEN:?set INSTAGRAM_CHOIZ_ACCESS_TOKEN in .env}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_CHOIZ_BUSINESS_ACCOUNT_ID:?set INSTAGRAM_CHOIZ_BUSINESS_ACCOUNT_ID in .env}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:?set FACEBOOK_APP_ID in .env}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:?set FACEBOOK_APP_SECRET in .env}
      INSTAGRAM_API_VERSION: "v23.0"
    restart: unless-stopped

  instagram_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/instagram:${IMAGE_TAG:-latest}
    environment:
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_TIMELESS_ACCESS_TOKEN:?set INSTAGRAM_TIMELESS_ACCESS_TOKEN in .env}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_TIMELESS_BUSINESS_ACCOUNT_ID:?set INSTAGRAM_TIMELESS_BUSINESS_ACCOUNT_ID in .env}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:?set FACEBOOK_APP_ID in .env}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:?set FACEBOOK_APP_SECRET in .env}
      INSTAGRAM_API_VERSION: "v23.0"
    restart: unless-stopped

  # GA4 MCP — official googleanalytics/google-analytics-mcp wrapped in
  # streamable-http. Multi-tenant pattern: one image, two containers
  # serving slugs /mcp/ga4-choiz and /mcp/ga4-timeless. Both containers
  # are functionally identical — the official MCP takes property_id as
  # a TOOL ARGUMENT (not an env var), so the model passes the right
  # property per call. The two containers exist purely so claude.ai
  # connectors stay separated by brand at the slug level (same pattern
  # as gsc).
  #
  # Service-account JSON (GA4_SERVICE_ACCOUNT_JSON_B64) is shared between
  # tenants (single Choiz reader account with access to both Choiz +
  # Timeless GA4 properties).
  #
  # Cutover 2026-05-07 (PR #14): replaced the Choiz fork
  # (Choizapp/choiz-ga4-mcp@a0278ff) and dropped supergateway. The
  # official MCP uses mcp.server.lowlevel.Server with hardcoded stdio;
  # mcp/ga4/entrypoint.py mounts it behind StreamableHTTPSessionManager
  # + uvicorn. Same shape as instagram (PR #12 + #13).
  #
  # mem_limit retained at 1500m as defense-in-depth pending
  # post-deploy measurement. The single-process pattern that landed
  # warehouse + facebook + instagram drops resident from ~1 GB to
  # ~50-150 MB, so this cap is likely loose; revisit after a stress
  # test.
  ga4_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/ga4:${IMAGE_TAG:-latest}
    environment:
      GA4_SERVICE_ACCOUNT_JSON_B64: ${GA4_SERVICE_ACCOUNT_JSON_B64:?set GA4_SERVICE_ACCOUNT_JSON_B64 in .env}
    mem_limit: 1500m
    pids_limit: 100
    restart: unless-stopped

  ga4_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/ga4:${IMAGE_TAG:-latest}
    environment:
      GA4_SERVICE_ACCOUNT_JSON_B64: ${GA4_SERVICE_ACCOUNT_JSON_B64:?set GA4_SERVICE_ACCOUNT_JSON_B64 in .env}
    mem_limit: 1500m
    pids_limit: 100
    restart: unless-stopped

  # GSC MCP — multi-tenant, mirrors ga4 except: no per-tenant env (the
  # public mcp-server-gsc package has no site-filter env var). Two
  # services exist purely to expose two slugs in claude.ai
  # (/mcp/gsc-choiz vs /mcp/gsc-timeless); the model picks the right
  # `siteUrl` per-tool-call based on the connector slug. Both services
  # use the SAME service-account JSON as GA4 (single Choiz reader account
  # with access to both Choiz + Timeless GSC sites). The compose-level
  # rename surfaces it as GSC_SERVICE_ACCOUNT_JSON_B64 inside the
  # container so the GSC entrypoint doesn't read a "GA4_*" name.
  #
  # Cutover 2026-05-07 (PR): supergateway dropped. /opt/entrypoint.mjs
  # imports the package's `createServer` builder and mounts it behind
  # StreamableHTTPServerTransport in-process — same shape as
  # warehouse / facebook / instagram / ga4 / google-ads, just in Node.
  # Pre-fix gsc_choiz_mcp ran at ~489 MiB resident under the
  # supergateway --stateless leak; expect a similar drop here as the
  # other Phase 1 MCPs.
  #
  # mem_limit retained at 1500m for now — actual post-fix resident is
  # likely 50-100 MiB. Revisit after stress test.
  gsc_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/gsc:${IMAGE_TAG:-latest}
    environment:
      GSC_SERVICE_ACCOUNT_JSON_B64: ${GA4_SERVICE_ACCOUNT_JSON_B64:?set GA4_SERVICE_ACCOUNT_JSON_B64 in .env}
    mem_limit: 1500m
    pids_limit: 100
    restart: unless-stopped

  gsc_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/gsc:${IMAGE_TAG:-latest}
    environment:
      GSC_SERVICE_ACCOUNT_JSON_B64: ${GA4_SERVICE_ACCOUNT_JSON_B64:?set GA4_SERVICE_ACCOUNT_JSON_B64 in .env}
    mem_limit: 1500m
    pids_limit: 100
    restart: unless-stopped

  # Google Ads MCP — re-enabled 2026-05-07 with the official
  # googleads/google-ads-mcp@2a09ac31. The original 2026-04-28 disable
  # was due to supergateway --stateless respawn-storming the heavy
  # google-ads gRPC stack on every request, which destabilized the
  # cloudflared tunnel. The official MCP runs in-process under FastMCP
  # via mcp/google-ads/entrypoint.py (warehouse-style monkey-patch); a
  # single GoogleAdsClient persists across requests. No supergateway,
  # no Node, no per-request churn — the storm pattern is structurally
  # impossible.
  #
  # Auth: static creds via /tmp/google-ads.yaml materialized from env
  # vars at container start. Same env contract as the previous fork.
  # Single tenant (Choiz MCC 3916621621). The model passes the
  # specific customer_id per tool call.
  google_ads_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/google-ads:${IMAGE_TAG:-latest}
    environment:
      GOOGLE_ADS_OAUTH_CLIENT_ID: ${GOOGLE_ADS_OAUTH_CLIENT_ID:?set GOOGLE_ADS_OAUTH_CLIENT_ID in .env}
      GOOGLE_ADS_OAUTH_CLIENT_SECRET: ${GOOGLE_ADS_OAUTH_CLIENT_SECRET:?set GOOGLE_ADS_OAUTH_CLIENT_SECRET in .env}
      GOOGLE_ADS_OAUTH_REFRESH_TOKEN: ${GOOGLE_ADS_OAUTH_REFRESH_TOKEN:?set GOOGLE_ADS_OAUTH_REFRESH_TOKEN in .env}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:?set GOOGLE_ADS_DEVELOPER_TOKEN in .env}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:?set GOOGLE_ADS_LOGIN_CUSTOMER_ID in .env}
    restart: unless-stopped

  # Shopify MCP — multi-tenant pattern (one image, two services), mirrors
  # facebook / instagram. Wraps GeLi2001/shopify-mcp's tools/registry but
  # exposes a READ-ONLY subset (names matching get-*); writes
  # (create-/update-/delete-/order-cancel/refund-create/inventory-set/...)
  # are filtered out in mcp/shopify/entrypoint.mjs.
  #
  # Architecture: same in-process Node pattern as gsc. No supergateway,
  # no per-request child churn. McpServer is mounted behind
  # StreamableHTTPServerTransport on :8080.
  #
  # Per-tenant differences: MYSHOPIFY_DOMAIN + SHOPIFY_ACCESS_TOKEN.
  # The Admin tokens must carry at minimum: read_products, read_orders,
  # read_customers, read_inventory, read_product_listings,
  # read_locations, read_price_rules, read_metafields. Missing scopes
  # surface as opaque 403s from the GraphQL endpoint.
  #
  # Payload ceiling caveat: claude.ai rejects MCP tool results above
  # ~2-3 KB. Shopify `get-orders`/`get-products` responses with full
  # line items + variants will overshoot — pass `limit` low (≤5) on
  # list calls. The entrypoint already serializes with compact
  # JSON.stringify (no indent). If we hit the ceiling in real use, the
  # next iteration is a field-trimming wrapper similar to the
  # google-ads MessageToDict filter (see project_mcp_patterns_learned).
  shopify_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/shopify:${IMAGE_TAG:-latest}
    environment:
      MYSHOPIFY_DOMAIN: ${SHOPIFY_CHOIZ_DOMAIN:?set SHOPIFY_CHOIZ_DOMAIN in .env}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_CHOIZ_ACCESS_TOKEN:?set SHOPIFY_CHOIZ_ACCESS_TOKEN in .env}
    restart: unless-stopped

  shopify_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/shopify:${IMAGE_TAG:-latest}
    environment:
      MYSHOPIFY_DOMAIN: ${SHOPIFY_TIMELESS_DOMAIN:?set SHOPIFY_TIMELESS_DOMAIN in .env}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_TIMELESS_ACCESS_TOKEN:?set SHOPIFY_TIMELESS_ACCESS_TOKEN in .env}
    restart: unless-stopped

  # Power BI MCP — multi-tenant pattern (one image, two containers), matches
  # ga4-choiz / ga4-timeless / gsc-choiz / gsc-timeless. Each container is
  # pinned to a single dataset GUID + brand label via env; the MCP `name`
  # surfaces as "powerbi-choiz" / "powerbi-timeless" in claude.ai. Tools have
  # no `dataset` argument — the route IS the brand. This eliminates the LLM
  # error of picking the wrong dataset when both models are reachable through
  # a single connector.
  #
  # Auth: shared Service Principal across both tenants (same workspace
  # contains both datasets). msal caches the bearer token in-process per
  # container and refreshes it silently before the 1-hour TTL, so end users
  # never see a re-auth prompt.
  #
  # Paths: /mcp/powerbi-choiz/ + /mcp/powerbi-timeless/. Cross-brand
  # comparisons require both connectors active simultaneously in claude.ai
  # — accepted trade-off (vs the prior single-connector design that let the
  # LLM pick the wrong slug). See PR splitting this on 2026-05-19.
  powerbi_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/powerbi:${IMAGE_TAG:-latest}
    environment:
      PBI_TENANT_ID: ${PBI_TENANT_ID:?set PBI_TENANT_ID in .env}
      PBI_CLIENT_ID: ${PBI_CLIENT_ID:?set PBI_CLIENT_ID in .env}
      PBI_CLIENT_SECRET: ${PBI_CLIENT_SECRET:?set PBI_CLIENT_SECRET in .env}
      PBI_WORKSPACE_ID: ${PBI_WORKSPACE_ID:?set PBI_WORKSPACE_ID in .env}
      PBI_DATASET_ID: ${PBI_DATASET_CHOIZ:?set PBI_DATASET_CHOIZ in .env}
      PBI_BRAND: choiz
    restart: unless-stopped

  powerbi_timeless_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/powerbi:${IMAGE_TAG:-latest}
    environment:
      PBI_TENANT_ID: ${PBI_TENANT_ID:?set PBI_TENANT_ID in .env}
      PBI_CLIENT_ID: ${PBI_CLIENT_ID:?set PBI_CLIENT_ID in .env}
      PBI_CLIENT_SECRET: ${PBI_CLIENT_SECRET:?set PBI_CLIENT_SECRET in .env}
      PBI_WORKSPACE_ID: ${PBI_WORKSPACE_ID:?set PBI_WORKSPACE_ID in .env}
      PBI_DATASET_ID: ${PBI_DATASET_TIMELESS:?set PBI_DATASET_TIMELESS in .env}
      PBI_BRAND: timeless
    restart: unless-stopped

  # TikTok Organic MCP — multi-tenant-ready (one image, one container per
  # brand), matches the powerbi / ga4 / facebook / instagram split. Each
  # container is pinned to a single brand via TIKTOK_BRAND + a long-lived
  # refresh_token in env; the MCP `name` surfaces as
  # "tiktok-organic-choiz" in claude.ai so the LLM can't pick the wrong
  # brand at tool-call time.
  #
  # Auth: TikTok Display API v2 OAuth. refresh_token is static (~365-day
  # TTL, does not rotate on refresh in our experience). access_token is
  # cached in-process and silently re-minted ~5 min before its 24h
  # expiry. No tokens.json — the legacy local server's filesystem
  # persistence is dropped. If the refresh_token expires we re-mint
  # manually in the Developer Portal and rotate the .env value via SSM.
  #
  # Only Choiz at launch (2026-05-19). To add Timeless: register the
  # Timeless TikTok account in the Dev Portal, mint a refresh_token,
  # add tiktok_organic_timeless_mcp here + an UPSTREAM_TIKTOK_ORGANIC_TIMELESS
  # entry in the gateway env + a /mcp/tiktok-organic-timeless route in
  # gateway/src/index.ts. Container code is brand-agnostic, no rebuild needed.
  tiktok_organic_choiz_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/tiktok-organic:${IMAGE_TAG:-latest}
    environment:
      TIKTOK_CLIENT_KEY: ${TIKTOK_CHOIZ_CLIENT_KEY:?set TIKTOK_CHOIZ_CLIENT_KEY in .env}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CHOIZ_CLIENT_SECRET:?set TIKTOK_CHOIZ_CLIENT_SECRET in .env}
      TIKTOK_REFRESH_TOKEN: ${TIKTOK_CHOIZ_REFRESH_TOKEN:?set TIKTOK_CHOIZ_REFRESH_TOKEN in .env}
      TIKTOK_BRAND: choiz
    restart: unless-stopped

  # DHL Express MCP — single tenant (one DHL Express account). Custom FastMCP
  # server (mcp/dhl/entrypoint.py) wrapping the MyDHL API over HTTP Basic auth.
  # Mirrors the tiktok-organic shape: requests + stateless_http, no SDK.
  #
  # WRITE-CAPABLE — unlike every other MCP here. create_shipment /
  # create_return_shipment generate real labels and can bill the DHL account.
  # Two guards: (1) the gateway auth chain is the only way in; (2) DHL_BASE_URL
  # defaults to the MyDHL *test* base inside the entrypoint, so production
  # bookings only happen when DHL_BASE_URL is explicitly set to the production
  # base below. Leave DHL_BASE_URL unset (test) until create-shipment payloads
  # are validated.
  #
  # Auth: DHL_API_KEY + DHL_API_SECRET (developer-portal app bound to the DHL
  # Express account) → static Basic header, no token refresh.
  dhl_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/dhl:${IMAGE_TAG:-latest}
    environment:
      DHL_API_KEY: ${DHL_API_KEY:?set DHL_API_KEY in .env}
      DHL_API_SECRET: ${DHL_API_SECRET:?set DHL_API_SECRET in .env}
      # Optional. Unset = MyDHL test base (safe default). Set to
      # https://express.api.dhl.com/mydhlapi for production.
      DHL_BASE_URL: ${DHL_BASE_URL:-}
      # Optional convenience default; the DHL account number normally travels
      # in the shipment body's `accounts`, not as a header.
      DHL_ACCOUNT_NUMBER: ${DHL_ACCOUNT_NUMBER:-}
      # Label downloads: the MCP stashes generated label PDFs in-memory and
      # returns a browser-openable link under this base. The gateway proxies
      # /dl/dhl/<token> -> this container's /download/<token>; the Worker
      # exposes it publicly (token is the capability). TTL in minutes.
      LABEL_DOWNLOAD_BASE_URL: ${LABEL_DOWNLOAD_BASE_URL:-https://mcp.choiz.com.mx/dl/dhl}
      LABEL_TTL_MINUTES: ${LABEL_TTL_MINUTES:-30}
      # Kill-switch for the write tools. Default OFF — create_shipment /
      # create_return_shipment refuse unless this is truthy. Set to "true" in
      # .env to let operators emit guides; flip back + restart to stop instantly.
      DHL_ALLOW_CREATE: ${DHL_ALLOW_CREATE:-false}
    restart: unless-stopped

  # Google Sheets MCP — xing5/mcp-google-sheets (FastMCP), served in-process
  # over Streamable HTTP by mcp/sheets/entrypoint.py. Same single-process
  # shape as ga4 / google-ads; no supergateway.
  #
  # Single tenant, single slug (/mcp/sheets). Sheets are not brand-scoped, so
  # there is no choiz/timeless split — the model addresses each spreadsheet by
  # its ID, and access is whatever is shared with the SA.
  #
  # Auth: a DEDICATED `sheets-editor` service account (NOT the read-only
  # ga4-mcp-reader). The package reads CREDENTIALS_CONFIG as base64 SA JSON
  # and builds credentials in-process (no /tmp file). Each spreadsheet to be
  # touched must be shared with the SA's client_email (Editor for writes).
  #
  # Write kill-switch — mirrors dhl's DHL_ALLOW_CREATE. Default OFF: the
  # entrypoint pins ENABLED_TOOLS to the read-only subset unless
  # SHEETS_ALLOW_WRITE is truthy, in which case all 20 tools (incl.
  # update_cells / batch_update / create_spreadsheet / share_spreadsheet)
  # are exposed. Flip to "true" in .env + restart to enable writes; flip
  # back + restart to stop instantly.
  #
  # mem_limit is a TIGHT 256m (not ga4's loose 1500m placeholder): measured
  # idle RSS is ~74 MB (REST-only stack, no grpcio, unlike ga4/google-ads).
  # On a 2 GB t4g.small running ~18 containers a per-container cap smaller
  # than total RAM is the whole point — if this MCP ever leaks, Docker
  # OOM-kills only this container (restart: unless-stopped) instead of the
  # kernel OOM-killer evicting a random neighbor. Raise only if a large
  # get_sheet_data response is observed pushing past the cap.
  sheets_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/sheets:${IMAGE_TAG:-latest}
    environment:
      # The package's env name is CREDENTIALS_CONFIG; we keep the repo's
      # *_SERVICE_ACCOUNT_JSON_B64 convention on the .env side and alias here.
      CREDENTIALS_CONFIG: ${SHEETS_SERVICE_ACCOUNT_JSON_B64:?set SHEETS_SERVICE_ACCOUNT_JSON_B64 in .env}
      SHEETS_ALLOW_WRITE: ${SHEETS_ALLOW_WRITE:-false}
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped

  # Viral Loops MCP — single tenant, READ-ONLY. Custom FastMCP server
  # (mcp/viral-loops/entrypoint.py) wrapping the Viral Loops Web API v3 over
  # HTTPS with a per-campaign apiToken header. Mirrors the dhl shape:
  # requests + stateless_http, no SDK. Only GET endpoints are wired (campaign
  # info/stats + participant data/referrals/rank/order/referrer/rewards), so
  # unlike dhl there is no write surface to guard.
  #
  # Auth: VIRAL_LOOPS_API_TOKEN — the campaign's SECRET apiToken (not the
  # client-safe publicToken). The token identifies the campaign; there is no
  # campaignId argument. Static, no refresh. Single tenant: one campaign per
  # container. To add a per-brand campaign later, copy this block to a
  # viral_loops_<brand>_mcp service + add an UPSTREAM_VIRAL_LOOPS_<BRAND> entry
  # and a /mcp/viral-loops-<brand> route — the image is brand-agnostic.
  #
  # mem_limit TIGHT 256m (matches sheets): REST-only stack, no heavy SDK; idle
  # RSS is tens of MB. A leak OOM-kills only this container (restart:
  # unless-stopped) instead of evicting a neighbor on the t4g.small.
  viral_loops_mcp:
    image: ghcr.io/choizapp/choiz-mcp-gateway/viral-loops:${IMAGE_TAG:-latest}
    environment:
      VIRAL_LOOPS_API_TOKEN: ${VIRAL_LOOPS_API_TOKEN:?set VIRAL_LOOPS_API_TOKEN in .env}
      # Optional override; defaults to https://app.viral-loops.com/api/v3 inside
      # the entrypoint. Leave unset in normal operation.
      VIRAL_LOOPS_BASE_URL: ${VIRAL_LOOPS_BASE_URL:-}
      # export_participants stashes the CSV/JSON in-memory and returns a
      # browser-openable link under this base. The gateway proxies
      # /dl/viral-loops/<token> -> this container's /download/<token>; the Worker
      # exposes it publicly (the token is the capability). TTL in minutes.
      VIRAL_LOOPS_DOWNLOAD_BASE_URL: ${VIRAL_LOOPS_DOWNLOAD_BASE_URL:-https://mcp.choiz.com.mx/dl/viral-loops}
      VIRAL_LOOPS_EXPORT_TTL_MINUTES: ${VIRAL_LOOPS_EXPORT_TTL_MINUTES:-30}
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped
