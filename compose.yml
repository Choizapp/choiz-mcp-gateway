# Choiz MCP Gateway stack
#
# Three-layer design:
#   Claude -> Cloudflare Worker -> cloudflared tunnel -> gateway -> upstream MCP(s)
#
# Only the gateway is reachable from cloudflared (127.0.0.1:8080).
# Upstream MCP containers are on an internal Docker network, not exposed.

services:
  gateway:
    build: ./gateway
    environment:
      PORT: "8080"
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:?set WORKER_SHARED_SECRET in .env}
      UPSTREAM_WAREHOUSE: "http://postgres_wh_mcp:8000"
    ports:
      # Bind only to the host's loopback; cloudflared runs on the same host.
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres_wh_mcp
    restart: unless-stopped

  postgres_wh_mcp:
    image: crystaldba/postgres-mcp:latest
    environment:
      DATABASE_URI: ${WAREHOUSE_DATABASE_URL:?set WAREHOUSE_DATABASE_URL in .env}
    command:
      - "--access-mode=restricted"
      - "--transport=sse"
      - "--sse-host=0.0.0.0"
      - "--sse-port=8000"
    restart: unless-stopped
    # No ports: block. The gateway reaches it by service name on the internal network.
