name: Ad-hoc SSM command

# Runs an arbitrary shell command as root on the gateway EC2 via AWS SSM.
# Triggered manually from the Actions UI or via `gh workflow run`. Reuses
# the same OIDC IAM role as deploy-gateway, so no new credentials anywhere.
#
# WHO CAN TRIGGER: anyone with write access to this repo (the Choizapp org).
# AUDIT: every invocation is a GitHub Actions run, retained 90 days.
# SAFETY: the underlying IAM role is scoped to ssm:SendCommand on this one
# instance with AWS-RunShellScript only.
#
# This workflow does NOT touch container images or compose.yml on push, so
# adding/editing this file does not trigger deploy-gateway.

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command(s) to run as root on the gateway EC2'
        required: true
        type: string
      timeout_seconds:
        description: 'SSM command timeout (seconds, max 600)'
        required: false
        default: '120'
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize ad-hoc commands so two parallel runs can't fight over the EC2.
  group: run-ssm
  cancel-in-progress: false

jobs:
  run:
    name: Run command via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM command
        id: send
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD: ${{ inputs.command }}
          TIMEOUT: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          # base64-encode to bypass quoting/newline parsing in the SSM API.
          # Decoded inline by /bin/sh on the EC2 root shell.
          CMD_B64=$(printf '%s' "$CMD" | base64 -w0)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ad-hoc by ${{ github.actor }}" \
            --timeout-seconds "$TIMEOUT" \
            --parameters "commands=[\"echo $CMD_B64 | base64 -d | sh\"]" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for completion
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.command_id }}
          TIMEOUT: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          # Allow timeout + 60s grace for SSM agent pickup + result fetch.
          DEADLINE=$(( TIMEOUT + 60 ))
          STEP=5
          ELAPSED=0
          while [ "$ELAPSED" -lt "$DEADLINE" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
                echo "::endgroup::"
                if [ "$STATUS" = "Success" ]; then
                  echo "Final status: $STATUS"
                  exit 0
                fi
                echo "Final status: $STATUS"
                exit 1
                ;;
            esac
            sleep "$STEP"
            ELAPSED=$(( ELAPSED + STEP ))
          done
          echo "TIMEOUT: SSM did not return within ${DEADLINE}s. Command may still be running."
          exit 1
