            ${{ env.IMAGE_PREFIX }}/shopify:${{ github.sha }}
          cache-from: type=gha,scope=shopify
          cache-to: type=gha,mode=max,scope=shopify

  build-powerbi:
    name: Build powerbi image
    needs: changes
    if: needs.changes.outputs.powerbi == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/powerbi
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/powerbi:latest
            ${{ env.IMAGE_PREFIX }}/powerbi:${{ github.sha }}
          cache-from: type=gha,scope=powerbi
          cache-to: type=gha,mode=max,scope=powerbi

  deploy:
    name: Deploy on EC2 via SSM
    needs: [build-gateway, build-warehouse, build-meta-ads, build-facebook, build-instagram, build-google-ads, build-ga4, build-gsc, build-shopify, build-powerbi]
    # Run only if at least one build succeeded. If all builds were skipped
    # (because nothing relevant changed, e.g. workflow-only edit), do not
    # touch the EC2 — there's nothing to deploy.
    if: ${{ !cancelled() && !failure() && (needs.build-gateway.result == 'success' || needs.build-warehouse.result == 'success' || needs.build-meta-ads.result == 'success' || needs.build-facebook.result == 'success' || needs.build-instagram.result == 'success' || needs.build-google-ads.result == 'success' || needs.build-ga4.result == 'success' || needs.build-gsc.result == 'success' || needs.build-shopify.result == 'success' || needs.build-powerbi.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Checkout (need compose.yml)
        uses: actions/checkout@v4
      - name: Send deploy command
        id: send
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REPO_PATH: ${{ vars.EC2_REPO_PATH }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Push compose.yml to EC2 inline (base64) so the EC2 needs no GitHub
          # credentials. The .env file on EC2 is untouched.
          COMPOSE_B64=$(base64 -w0 compose.yml)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy gateway from ${GIT_SHA:0:7}" \
            --parameters "commands=[\"set -eu\",\"mkdir -p ${REPO_PATH}\",\"echo ${COMPOSE_B64} | base64 -d > ${REPO_PATH}/compose.yml\",\"cd ${REPO_PATH}\",\"docker compose pull\",\"docker compose up -d\",\"docker image prune -f\",\"docker compose ps\"]" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $CMD_ID"
      - name: Wait for deploy to complete
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          # Poll up to 10 minutes (120 * 5s).
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
                echo "::endgroup::"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text
                echo "::endgroup::"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1
