name: Build and deploy gateway stack

# Triggers when anything that goes into a container image (gateway, warehouse,
# meta-ads) or the compose file changes. Each image is built only if its own
# context changed; the deploy step runs once at the end.
#
# Required GitHub secrets:
#   AWS_ROLE_ARN       — IAM role assumed via OIDC (see docs/CICD.md)
#   AWS_REGION         — region of the EC2 instance (e.g. us-east-1)
#   EC2_INSTANCE_ID    — i-xxxxxxxxxxxx of the gateway EC2
#
# Required GitHub variable (Settings → Variables):
#   EC2_REPO_PATH      — absolute path of the repo on the EC2 (e.g. /home/ssm-user/choiz-mcp-gateway)

on:
  push:
    branches: [master]
    paths:
      - 'gateway/**'
      - 'mcp/**'
      - 'compose.yml'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:

# Avoid concurrent deploys clobbering each other.
concurrency:
  group: deploy-gateway
  cancel-in-progress: false

permissions:
  contents: read
  packages: write     # push to GHCR
  id-token: write     # AWS OIDC

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase. github.repository preserves original case,
  # so hardcode the lowercased path here.
  IMAGE_PREFIX: ghcr.io/choizapp/choiz-mcp-gateway

jobs:
  changes:
    name: Detect changed contexts
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      warehouse: ${{ steps.filter.outputs.warehouse }}
      meta_ads: ${{ steps.filter.outputs.meta_ads }}
      facebook: ${{ steps.filter.outputs.facebook }}
      instagram: ${{ steps.filter.outputs.instagram }}
      google_ads: ${{ steps.filter.outputs.google_ads }}
      ga4: ${{ steps.filter.outputs.ga4 }}
      gsc: ${{ steps.filter.outputs.gsc }}
      shopify: ${{ steps.filter.outputs.shopify }}
      powerbi: ${{ steps.filter.outputs.powerbi }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'gateway/**'
            warehouse:
              - 'mcp/warehouse/**'
            meta_ads:
              - 'mcp/meta-ads/**'
            facebook:
              - 'mcp/facebook/**'
            instagram:
              - 'mcp/instagram/**'
            google_ads:
              - 'mcp/google-ads/**'
            ga4:
              - 'mcp/ga4/**'
            gsc:
              - 'mcp/gsc/**'
            shopify:
              - 'mcp/shopify/**'
            powerbi:
              - 'mcp/powerbi/**'
            compose:
              - 'compose.yml'

  build-gateway:
    name: Build gateway image
    needs: changes
    # Rebuild on source change OR compose.yml change (compose changes can imply
    # image-version bumps or new env wiring, easier to rebuild all than guess).
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/gateway:latest
            ${{ env.IMAGE_PREFIX }}/gateway:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  build-warehouse:
    name: Build warehouse image
    needs: changes
    if: needs.changes.outputs.warehouse == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/warehouse
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/warehouse:latest
