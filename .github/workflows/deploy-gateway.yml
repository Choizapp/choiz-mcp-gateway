          cache-from: type=gha,scope=ga4
          cache-to: type=gha,mode=max,scope=ga4

  build-gsc:
    name: Build gsc image
    needs: changes
    if: needs.changes.outputs.gsc == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
