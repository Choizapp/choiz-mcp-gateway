          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/meta-ads
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/meta-ads:latest
            ${{ env.IMAGE_PREFIX }}/meta-ads:${{ github.sha }}
          cache-from: type=gha,scope=meta-ads
          cache-to: type=gha,mode=max,scope=meta-ads

  build-facebook:
    name: Build facebook image
    needs: changes
    if: needs.changes.outputs.facebook == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/facebook
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/facebook:latest
            ${{ env.IMAGE_PREFIX }}/facebook:${{ github.sha }}
          cache-from: type=gha,scope=facebook
          cache-to: type=gha,mode=max,scope=facebook

  build-instagram:
    name: Build instagram image
    needs: changes
    if: needs.changes.outputs.instagram == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/instagram
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/instagram:latest
            ${{ env.IMAGE_PREFIX }}/instagram:${{ github.sha }}
          cache-from: type=gha,scope=instagram
          cache-to: type=gha,mode=max,scope=instagram

  build-google-ads:
    name: Build google-ads image
    needs: changes
    if: needs.changes.outputs.google_ads == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mcp/google-ads
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/google-ads:latest
            ${{ env.IMAGE_PREFIX }}/google-ads:${{ github.sha }}
          cache-from: type=gha,scope=google-ads
          cache-to: type=gha,mode=max,scope=google-ads

  build-ga4:
    name: Build ga4 image
    needs: changes
    if: needs.changes.outputs.ga4 == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
