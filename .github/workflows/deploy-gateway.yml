          cache-from: type=gha,scope=warehouse
          cache-to: type=gha,mode=max,scope=warehouse

  build-meta-ads:
    name: Build meta-ads image
    needs: changes
    if: needs.changes.outputs.meta_ads == 'true' || needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
