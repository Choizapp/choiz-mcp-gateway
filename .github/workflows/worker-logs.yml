name: Tail worker logs

# Ops escape hatch: stream the Cloudflare Worker's live logs (including
# uncaught exceptions) while hitting an endpoint, and print what came back.
# The Worker equivalent of run-ssm.yml — `observability` is already enabled in
# wrangler.jsonc, but nothing in this repo could read the output without a
# Cloudflare login. Added 2026-09-11 while debugging /register returning HTTP
# 500 (Cloudflare error 1101 = uncaught exception), the failure behind ops
# issue #62 that blocks every connector sign-in.
#
# WHO CAN TRIGGER: anyone with write access. AUDIT: every run is an Actions run.
# Reuses CLOUDFLARE_API_TOKEN, the same secret deploy-worker.yml already uses.

on:
  workflow_dispatch:
    inputs:
      probe_path:
        description: 'Path to hit while tailing (e.g. /register). Empty = just listen.'
        required: false
        default: '/register'
        type: string
      probe_method:
        description: 'HTTP method for the probe'
        required: false
        default: 'POST'
        type: string
      seconds:
        description: 'How long to tail (max 120)'
        required: false
        default: '45'
        type: string

permissions:
  contents: read

concurrency:
  group: worker-logs
  cancel-in-progress: false

jobs:
  tail:
    name: wrangler tail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Tail while probing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROBE_PATH: ${{ inputs.probe_path }}
          PROBE_METHOD: ${{ inputs.probe_method }}
          SECONDS_TO_TAIL: ${{ inputs.seconds }}
        run: |
          set -uo pipefail
          secs="${SECONDS_TO_TAIL:-45}"
          [ "$secs" -gt 120 ] 2>/dev/null && secs=120
          # --format json keeps exceptions structured; tail needs a moment to
          # attach before the probe fires, or the event is missed entirely.
          npx wrangler tail --format json > /tmp/tail.json 2>/tmp/tail.err &
          tail_pid=$!
          sleep 12
          if [ -n "$PROBE_PATH" ]; then
            echo "Probing ${PROBE_METHOD} https://mcp.choiz.com.mx${PROBE_PATH}"
            curl -s -o /tmp/probe.out -w 'probe HTTP %{http_code}\n' \
              -X "${PROBE_METHOD}" "https://mcp.choiz.com.mx${PROBE_PATH}" \
              -H 'content-type: application/json' \
              -d '{"client_name":"worker-logs-probe","redirect_uris":["https://claude.ai/api/mcp/auth_callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none"}' \
              --max-time 25 || true
            echo "--- probe response body ---"
            head -c 500 /tmp/probe.out || true
            echo
          fi
          sleep "$secs"
          kill "$tail_pid" 2>/dev/null || true
          echo "::group::wrangler stderr"
          head -40 /tmp/tail.err || true
          echo "::endgroup::"
          echo "=== EXCEPTIONS ==="
          grep -o '"exceptions":\[[^]]*\]' /tmp/tail.json | grep -v '"exceptions":\[\]' | head -20 || echo "(ninguna capturada)"
          echo "=== LOGS ==="
          grep -o '"logs":\[[^]]*\]' /tmp/tail.json | grep -v '"logs":\[\]' | head -20 || echo "(ninguno)"
          echo "=== RAW (primeros 3000 chars) ==="
          head -c 3000 /tmp/tail.json || true

      - name: KV write history (por que se agota la cuota, y desde cuando)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          ACC=762c1f9f78781abc984d56c18185af3a
          NS=9f2f4efa91a54ec2ae05aa28c43b27c0
          GQL=https://api.cloudflare.com/client/v4/graphql
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          echo "=== plan de la cuenta ==="
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC" | head -c 600; echo
          echo "=== subscripciones ==="
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/subscriptions" | head -c 600; echo

          echo "=== operaciones KV por dia y tipo (ultimos 45 dias) ==="
          cat > /tmp/q.json <<JSON
          {"query":"{ viewer { accounts(filter: {accountTag: \"$ACC\"}) { kvOperationsAdaptiveGroups(filter: {date_geq: \"2026-07-28\", date_leq: \"2026-09-11\"}, limit: 2000, orderBy: [date_ASC]) { sum { requests } dimensions { date actionType } } } } }"}
JSON
          curl -s -X POST "$GQL" -H "$AUTH" -H 'content-type: application/json' --data @/tmp/q.json > /tmp/kv.json
          head -c 300 /tmp/kv.json; echo
          echo "--- writes por dia ---"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/kv.json'))
              accs=d.get('data',{}).get('viewer',{}).get('accounts',[])
              if not accs:
                  print('sin datos; errors=', json.dumps(d.get('errors'))[:400]); raise SystemExit
              rows=accs[0].get('kvOperationsAdaptiveGroups',[])
              agg={}
              for r in rows:
                  dim=r['dimensions']; agg.setdefault(dim['date'],{})[dim['actionType']]=r['sum']['requests']
              for day in sorted(agg):
                  w=agg[day].get('write',0)+agg[day].get('delete',0)
                  print(f"{day}  write={agg[day].get('write',0):>6}  delete={agg[day].get('delete',0):>5}  read={agg[day].get('read',0):>7}  list={agg[day].get('list',0):>4}  -> facturable(w+d)={w}")
          except Exception as e:
              print('error parseando:', e)
          PY
          echo "HIST_FIN"

      - name: KV diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          NS=9f2f4efa91a54ec2ae05aa28c43b27c0
          # --remote is REQUIRED: wrangler v4 kv commands operate on LOCAL
          # miniflare state by default, which always looks empty in CI.
          echo "=== conteo de claves (remoto) ==="
          npx wrangler kv key list --remote --namespace-id "$NS" 2>/dev/null | grep -c '"name"' || echo "error"
          echo "=== prefijos ==="
          npx wrangler kv key list --remote --namespace-id "$NS" 2>/dev/null | grep -o '"name": "[a-z]*:' | sort | uniq -c | head
          echo "=== WRITE remoto (salida COMPLETA, no falla el step) ==="
          npx wrangler kv key put --remote --namespace-id "$NS" "diag:probe" "ok" > /tmp/w.txt 2>&1
          echo "write_exit=$?"
          cat /tmp/w.txt
          echo "=== READ BACK ==="
          npx wrangler kv key get --remote --namespace-id "$NS" "diag:probe" > /tmp/g.txt 2>&1
          echo "read_exit=$?"
          cat /tmp/g.txt
          npx wrangler kv key delete --remote --namespace-id "$NS" "diag:probe" >/dev/null 2>&1 || true
          echo "DIAG_FIN"
