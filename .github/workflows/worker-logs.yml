name: Tail worker logs

# Ops escape hatch: stream the Cloudflare Worker's live logs (including
# uncaught exceptions) while hitting an endpoint, and print what came back.
# The Worker equivalent of run-ssm.yml — `observability` is already enabled in
# wrangler.jsonc, but nothing in this repo could read the output without a
# Cloudflare login. Added 2026-09-11 while debugging /register returning HTTP
# 500 (Cloudflare error 1101 = uncaught exception), the failure behind ops
# issue #62 that blocks every connector sign-in.
#
# WHO CAN TRIGGER: anyone with write access. AUDIT: every run is an Actions run.
# Reuses CLOUDFLARE_API_TOKEN, the same secret deploy-worker.yml already uses.

on:
  workflow_dispatch:
    inputs:
      probe_path:
        description: 'Path to hit while tailing (e.g. /register). Empty = just listen.'
        required: false
        default: '/register'
        type: string
      probe_method:
        description: 'HTTP method for the probe'
        required: false
        default: 'POST'
        type: string
      seconds:
        description: 'How long to tail (max 120)'
        required: false
        default: '45'
        type: string

permissions:
  contents: read

concurrency:
  group: worker-logs
  cancel-in-progress: false

jobs:
  tail:
    name: wrangler tail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Tail while probing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROBE_PATH: ${{ inputs.probe_path }}
          PROBE_METHOD: ${{ inputs.probe_method }}
          SECONDS_TO_TAIL: ${{ inputs.seconds }}
        run: |
          set -uo pipefail
          secs="${SECONDS_TO_TAIL:-45}"
          [ "$secs" -gt 120 ] 2>/dev/null && secs=120
          # --format json keeps exceptions structured; tail needs a moment to
          # attach before the probe fires, or the event is missed entirely.
          npx wrangler tail --format json > /tmp/tail.json 2>/tmp/tail.err &
          tail_pid=$!
          sleep 12
          if [ -n "$PROBE_PATH" ]; then
            echo "Probing ${PROBE_METHOD} https://mcp.choiz.com.mx${PROBE_PATH}"
            curl -s -o /tmp/probe.out -w 'probe HTTP %{http_code}\n' \
              -X "${PROBE_METHOD}" "https://mcp.choiz.com.mx${PROBE_PATH}" \
              -H 'content-type: application/json' \
              -d '{"client_name":"worker-logs-probe","redirect_uris":["https://claude.ai/api/mcp/auth_callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none"}' \
              --max-time 25 || true
            echo "--- probe response body ---"
            head -c 500 /tmp/probe.out || true
            echo
          fi
          sleep "$secs"
          kill "$tail_pid" 2>/dev/null || true
          echo "::group::wrangler stderr"
          head -40 /tmp/tail.err || true
          echo "::endgroup::"
          echo "=== EXCEPTIONS ==="
          grep -o '"exceptions":\[[^]]*\]' /tmp/tail.json | grep -v '"exceptions":\[\]' | head -20 || echo "(ninguna capturada)"
          echo "=== LOGS ==="
          grep -o '"logs":\[[^]]*\]' /tmp/tail.json | grep -v '"logs":\[\]' | head -20 || echo "(ninguno)"
          echo "=== RAW (primeros 3000 chars) ==="
          head -c 3000 /tmp/tail.json || true

      - name: KV write history (por que se agota la cuota, y desde cuando)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          ACC=762c1f9f78781abc984d56c18185af3a
          NS=9f2f4efa91a54ec2ae05aa28c43b27c0
          GQL=https://api.cloudflare.com/client/v4/graphql
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          echo "=== plan de la cuenta ==="
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC" | head -c 600; echo
          echo "=== subscripciones ==="
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/accounts/$ACC/subscriptions" | head -c 600; echo

          echo "=== operaciones KV por dia y tipo ==="
          # NOTE: no heredocs in this file. An unindented terminator ends the
          # YAML block scalar and silently breaks the whole workflow (GitHub
          # then reports "does not have workflow_dispatch trigger"). Build the
          # payload with printf and parse with a single-line python3 -c.
          Q='{ viewer { accounts(filter: {accountTag: \"ACCTAG\"}) { kvOperationsAdaptiveGroups(filter: {date_geq: \"2026-07-28\", date_leq: \"2026-09-12\"}, limit: 2000, orderBy: [date_ASC]) { sum { requests } dimensions { date actionType } } } } }'
          Q=${Q//ACCTAG/$ACC}
          printf '{"query":"%s"}' "$Q" > payload.json
          curl -s -X POST "$GQL" -H "$AUTH" -H 'content-type: application/json' --data @payload.json > kv.json
          echo "--- respuesta cruda (300) ---"; head -c 300 kv.json; echo
          echo "--- operaciones por dia ---"
          python3 -c "import json;d=json.load(open('kv.json'));a=d.get('data',{}).get('viewer',{}).get('accounts',[]);print('ERRORS:',json.dumps(d.get('errors'))[:500]) if not a else [print('{:12} write={:>6} delete={:>6} read={:>8} list={:>5}'.format(k,v.get('write',0),v.get('delete',0),v.get('read',0),v.get('list',0))) for k,v in sorted(__import__('functools').reduce(lambda acc,r:(acc.setdefault(r['dimensions']['date'],{}).update({r['dimensions']['actionType']:r['sum']['requests']}),acc)[1],a[0].get('kvOperationsAdaptiveGroups',[]),{}).items())]"
          echo "HIST_FIN"

      - name: KV diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # set +e is REQUIRED: GitHub runs steps with `bash -e`, so a failing
          # write aborts the step before printing the error we came for.
          set +e
          NS=9f2f4efa91a54ec2ae05aa28c43b27c0
          # --remote is REQUIRED: wrangler v4 kv commands operate on LOCAL
          # miniflare state by default, which always looks empty in CI.
          echo "=== WRITE remoto (salida completa) ==="
          npx wrangler kv key put --remote --namespace-id "$NS" "diag:probe" "ok" 2>&1 | tail -30
          echo "--- fin write ---"
          echo "=== permisos del token ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" | head -c 400
          echo
          echo "=== write por REST API (error crudo de Cloudflare) ==="
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts" \
            | grep -o '"id":"[0-9a-f]*"' | head -1 | cut -d'"' -f4)
          echo "account_id_detectado=${ACC:-ninguno}"
          if [ -n "$ACC" ]; then
            curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$NS/values/diag:probe2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F "value=ok" -F "metadata={}" | head -c 900
            echo
          fi
          echo "DIAG_FIN"
